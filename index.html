function saveCMS(e){e.preventDefault();const f=new FormData(e.target);db.settings.heroTitle=String(f.get('heroTitle')).trim();db.settings.heroDesc=String(f.get('heroDesc')).trim();db.settings.heroImage=pendingHero||String(f.get('heroImage')).trim()||db.settings.heroImage;pendingHero='';save();toast('Homepage announcement updated.');renderAdmin();return false}
let directoryFilterState={query:'',program:'',status:''};
function directoryRows(list){return list.map(v=>`<tr data-volunteer-row="${esc(v.id)}"><td><div class="flex items-center gap-3">${avatar(v)}<div><div class="font-bold">${esc(v.name)}</div><div class="text-xs text-slate-400">${esc(v.id)} · “${esc(v.alias)}”</div><div class="text-xs text-slate-500">${esc(v.education||'Program not provided')}</div></div></div></td><td><div class="font-semibold">${esc(v.sogiesc||'Not provided')}</div><div class="text-xs text-slate-500">${esc(v.location||'Location not provided')}</div><div class="text-xs text-slate-500">${esc(v.email||'No email on file')}</div></td><td class="font-black text-violet-700">${totalPoints(v)}</td><td><span class="pill ${v.status==='Active'?'pill-green':v.status==='Archived'?'pill-yellow':'pill-red'}">${esc(v.status)}</span></td><td><button class="pill ${v.published?'pill-purple':'pill-gray'}" onclick="togglePublished('${v.id}')">${v.published?'Published':'Hidden'} <i class="fa-solid fa-rotate ml-1"></i></button></td><td><div class="flex flex-wrap gap-2"><button class="btn btn-soft text-xs" onclick="inspectVolunteer('${v.id}')">View profile</button><button class="btn btn-line text-xs" onclick="editVolunteer('${v.id}')" aria-label="Edit ${esc(v.name)}"><i class="fa-solid fa-pen"></i> Edit</button><button class="btn ${v.status==='Archived'?'btn-primary':'btn-soft'} text-xs" onclick="toggleVolunteerArchive('${v.id}')"><i class="fa-solid ${v.status==='Archived'?'fa-box-open':'fa-box-archive'}"></i> ${v.status==='Archived'?'Unarchive':'Archive'}</button></div></td></tr>`).join('')||'<tr><td colspan="6" class="text-center py-8 text-slate-400">No volunteers match these filters. Try clearing one or more filters.</td></tr>'}
function setDirectoryFilter(key,value){directoryFilterState[key]=value;filterDirectory()}
function resetDirectoryFilters(){directoryFilterState={query:'',program:'',status:''};const q=document.getElementById('directorySearch'),p=document.getElementById('directoryProgramFilter'),st=document.getElementById('directoryStatusFilter');if(q)q.value='';if(p)p.value='';if(st)st.value='';filterDirectory()}
function filterDirectory(){const q=String(directoryFilterState.query||'').toLowerCase().trim();const list=db.volunteers.filter(v=>{const matchesQuery=[v.id,v.name,v.email,v.alias,v.skills,v.location,v.education,v.sogiesc].some(x=>String(x||'').toLowerCase().includes(q));const matchesProgram=!directoryFilterState.program||String(v.education||'').trim()===directoryFilterState.program;const matchesStatus=!directoryFilterState.status||v.status===directoryFilterState.status;return matchesQuery&&matchesProgram&&matchesStatus});const body=document.getElementById('directoryBody');if(body)body.innerHTML=directoryRows(list);const count=document.getElementById('directoryResultCount');if(count)count.textContent=`Showing ${list.length} of ${db.volunteers.length} volunteer account(s)`}

function toggleStatus(id){const v=volunteerById(id);if(!v)return;v.status=v.status==='Active'?'Inactive':'Active';save();toast(`Member marked ${v.status.toLowerCase()}.`);renderAdmin()}
function toggleVolunteerArchive(id){const v=volunteerById(id);if(!v)return;if(v.status==='Archived'){v.status='Active';v.unarchivedAt=new Date().toISOString().slice(0,10);toast('Volunteer account unarchived. The volunteer can sign in again.')}else{if(!confirm(`Archive ${v.name}'s account? They will not be able to sign in until the account is unarchived.`))return;v.status='Archived';v.archivedAt=new Date().toISOString().slice(0,10);if(session?.type==='volunteer'&&session.id===id){session=null;persistVolunteerSession();clearVolunteerInactivityTimer()}toast('Volunteer account archived. Access is blocked until restored.')}save();renderAdmin()}
function togglePublished(id){const v=volunteerById(id);v.published=!v.published;save();toast(`Leaderboard visibility ${v.published?'enabled':'hidden'}.`);renderAdmin()}
function inspectVolunteer(id){const v=volunteerById(id),subs=volunteerSubs(id);modal(`<div class="p-5 sm:p-7"><div class="flex justify-between items-start gap-3"><div class="flex items-center gap-3">${avatar(v)}<div><h2 class="text-2xl font-black">${esc(v.name)}</h2><div class="text-sm text-slate-500">“${esc(v.alias)}” · ${esc(v.id)}</div></div></div><button type="button" aria-label="Close dialog" class="btn btn-soft" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button></div><div class="grid sm:grid-cols-2 gap-3 mt-6">${[['Birthdate',fmtDate(v.birthdate)],['SOGIESC',v.sogiesc],['Education',v.education],['Location',v.location],['Active email',v.email||'Not provided'],['Skills',v.skills||'Not provided'],['Joined',fmtDate(v.createdAt)],['Original join year',v.joinedYear||((v.id||'').match(/^WE-(\d{4})-/)||[])[1]||'Not recorded'],['Status',v.status],['Leaderboard',v.published?'Published':'Hidden'],['WE Points',totalPoints(v)]].map(([a,b])=>`<div class="bg-slate-50 rounded-xl p-3"><div class="text-xs text-slate-400 font-bold">${a}</div><div class="font-semibold text-sm mt-1 break-words">${esc(b)}</div></div>`).join('')}</div><div class="mt-4 rounded-xl border border-amber-200 bg-amber-50 p-3 text-sm text-amber-900"><b>Password security:</b> Passwords are not displayed to administrators. If a volunteer cannot sign in, use the password assistance section to reset access; the volunteer should then change the temporary password.</div><h3 class="font-black text-lg mt-6 mb-2">Submission history</h3><div class="table-wrap"><table><thead><tr><th>Task</th><th>Role</th><th>Points</th><th>Status</th></tr></thead><tbody>${subs.length?subs.map(s=>`<tr><td>${esc(s.taskTitle)}</td><td>${esc(s.role)}</td><td>${s.points}</td><td><span class="pill ${s.status==='Approved'?'pill-green':s.status==='Declined'?'pill-red':'pill-yellow'}">${esc(s.status)}</span></td></tr>`).join(''):'<tr><td colspan="4" class="text-center text-slate-400">No task submissions.</td></tr>'}</tbody></table></div><div class="flex justify-end mt-5"><button class="btn btn-line" onclick="closeModal()">Close</button></div></div>`,true)}
function showDrilldown(field,value){const list=db.volunteers.filter(v=>v[field]===value);modal(`<div class="p-5 sm:p-7"><div class="flex justify-between items-start"><div><span class="pill pill-purple mb-2">Analytics drill-down</span><h2 class="text-2xl font-black">${esc(value)}</h2><p class="text-sm text-slate-500 mt-1">${list.length} matching volunteer profile(s)</p></div><button type="button" aria-label="Close dialog" class="btn btn-soft" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button></div><div class="mt-5 space-y-3">${list.map(v=>`<button class="w-full text-left border rounded-xl p-3 flex items-center gap-3 hover:bg-purple-50" onclick="inspectVolunteer('${v.id}')">${avatar(v)}<div class="flex-1"><div class="font-bold">${esc(v.name)} <span class="text-xs text-slate-400">(${esc(v.alias)})</span></div><div class="text-xs text-slate-500">${esc(v.id)} · ${esc(v.location)} · ${esc(v.education)}</div></div><span class="pill pill-purple">${totalPoints(v)} pts</span></button>`).join('')}</div></div>`,true)}
function editVolunteer(id){const v=volunteerById(id);modal(`<div class="p-6"><div class="flex justify-between"><h2 class="text-2xl font-black">Edit volunteer profile</h2><button type="button" aria-label="Close dialog" class="btn btn-soft" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button></div><form class="mt-5 space-y-4" onsubmit="return saveVolunteerAdmin(event,'${id}')"><div><label class="label">Full name</label><input class="field" name="name" value="${esc(v.name)}" required></div><div><label class="label">Preferred alias</label><input class="field" name="alias" value="${esc(v.alias)}" required></div><div><label class="label">Location</label><input class="field" name="location" value="${esc(v.location)}" required></div><div><label class="label">Skills</label><textarea class="field" name="skills">${esc(v.skills)}</textarea></div><div><label class="label">SOGIESC</label><select class="field" name="sogiesc">${['Lesbian','Gay','Bisexual','Transgender','Queer','Intersex','Asexual','Pansexual','Non-binary','Questioning','Prefer not to say','Another identity'].map(x=>`<option ${x===v.sogiesc?'selected':''}>${x}</option>`).join('')}</select></div><div><label class="label">Gender</label><select class="field" name="gender">${['Not provided','Woman','Man','Trans woman','Trans man','Non-binary','Another gender identity','Prefer not to say'].map(x=>`<option ${x===String(v.gender||'Not provided')?'selected':''}>${x}</option>`).join('')}</select></div><button class="btn btn-primary w-full">Save profile</button></form></div>`)}
function saveVolunteerAdmin(e,id){e.preventDefault();const v=volunteerById(id),f=new FormData(e.target);['name','alias','location','skills','sogiesc','gender'].forEach(k=>v[k]=String(f.get(k)||'').trim());save();closeModal();toast('Volunteer profile updated.');renderAdmin();return false}
function openAdminPassword(){modal(`<div class="p-6"><div class="flex justify-between"><div><span class="pill pill-purple mb-2">Security</span><h2 class="text-2xl font-black">Password manager</h2></div><button type="button" aria-label="Close dialog" class="btn btn-soft" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button></div><p class="text-sm text-slate-500 mt-2">Update the username and passkey used to unlock the Admin Center.</p><form class="mt-5 space-y-4" onsubmit="return saveAdminPassword(event)"><div><label class="label">Current passkey</label><input class="field" name="current" type="password" required></div><div><label class="label">New admin username</label><input class="field" name="username" value="${esc(db.settings.adminUser)}" required></div><div><label class="label">New passkey</label><input class="field" name="key" type="password" minlength="8" required></div><button class="btn btn-primary w-full">Save security settings</button></form></div>`)}
function saveAdminPassword(e){e.preventDefault();const f=new FormData(e.target);if(String(f.get('current'))!==db.settings.adminKey){toast('Current admin passkey is incorrect.','error');return false}if(String(f.get('key')).length<8){toast('Passkey must be at least 8 characters.','error');return false}db.settings.adminUser=String(f.get('username')).trim();db.settings.adminKey=String(f.get('key'));save();closeModal();toast('Admin credentials updated.');return false}
function openAddEvent(){modal(`<div class="p-6"><div class="flex justify-between"><h2 class="text-2xl font-black">Add community project</h2><button type="button" aria-label="Close dialog" class="btn btn-soft" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button></div><form class="mt-5 space-y-4" onsubmit="return addEvent(event)"><div><label class="label">Project title</label><input class="field" name="title" required></div><div class="grid sm:grid-cols-2 gap-3"><div><label class="label">Start date</label><input class="field" type="date" name="date" required></div><div><label class="label">Expected completion date</label><input class="field" type="date" name="endDate" required></div><div class="sm:col-span-2"><label class="label">Location</label><input class="field" name="location" required></div></div><div><label class="label">Description</label><textarea class="field" name="description" rows="3" required></textarea></div><div><label class="label">Image URL (optional)</label><input class="field" name="image" id="projectImageUrl" placeholder="https://..."></div><div><label class="label">Or upload a project photo</label><input class="field" type="file" accept="image/*" onchange="previewProjectImage(event)"><div id="projectImagePreview" class="mt-2 text-xs text-slate-400">Choose an image under 850 KB.</div></div><div><label class="label">Total points available for this project *</label><input class="field" name="points" type="number" min="1" max="10000" value="100" required></div><div class="rounded-xl bg-purple-50 p-3 text-xs text-purple-800">The administrator sets the project points. This value will be assigned to its general volunteer task.</div><button class="btn btn-primary w-full">Create project</button></form></div>`)}
let pendingProjectImage='',pendingAnnouncementImage='';
function previewProjectImage(e){const f=e.target.files?.[0];if(!f)return;if(f.size>850000){toast('Please choose a project photo under 850 KB.','error');e.target.value='';return}const r=new FileReader();r.onload=()=>{pendingProjectImage=r.result;const el=document.getElementById('projectImagePreview');if(el)el.innerHTML=`<img src="${pendingProjectImage}" alt="Project photo preview" class="w-32 h-20 object-cover rounded-lg border">`};r.readAsDataURL(f)}
function previewAnnouncementImage(e){const f=e.target.files?.[0];if(!f)return;if(f.size>850000){toast('Please choose an announcement photo under 850 KB.','error');e.target.value='';return}const r=new FileReader();r.onload=()=>{pendingAnnouncementImage=r.result;const el=document.getElementById('announcementImagePreview');if(el)el.innerHTML=`<img src="${pendingAnnouncementImage}" alt="Announcement photo preview" class="w-32 h-20 object-cover rounded-lg border">`};r.readAsDataURL(f)}
function addEvent(e){e.preventDefault();const f=new FormData(e.target),id='EV-'+String(Date.now()).slice(-5),startDate=String(f.get('date')||''),endDate=String(f.get('endDate')||'');if(!startDate||!endDate||endDate<startDate){toast('The expected completion date must be on or after the start date.','error');return false}db.events.push({id,title:String(f.get('title')).trim(),date:startDate,endDate,location:String(f.get('location')).trim(),description:String(f.get('description')).trim(),image:pendingProjectImage||String(f.get('image')||'').trim()||'https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&fit=crop&w=900&q=80',archived:false,tasks:[{id:'TK-'+String(Date.now()).slice(-6),title:'General volunteer support',points:Math.max(1,Number(f.get('points')||100)),description:'Support the project team with assigned event tasks.'}]});pendingProjectImage='';save();closeModal();toast('Community project created.');renderAdmin();return false}
function addAnnouncement(e){e.preventDefault();const f=new FormData(e.target);db.settings.announcements=db.settings.announcements||[];db.settings.announcements.unshift({id:'AN-'+Date.now(),title:String(f.get('title')).trim(),date:String(f.get('date')||''),body:String(f.get('body')).trim(),image:pendingAnnouncementImage||String(f.get('image')||'').trim(),published:true});pendingAnnouncementImage='';save();toast('Announcement added.');renderAdmin();return false}
function sendAdminMessage(e){e.preventDefault();const v=volunteerById(session?.id);if(!v)return false;const f=new FormData(e.target),subject=titleCaseWords(String(f.get('subject')||'')),body=String(f.get('body')||'').trim();if(!subject||!body){toast('Enter a subject and message.','error');return false}db.messages=db.messages||[];db.messages.push({id:'MSG-'+Date.now(),volunteerId:v.id,subject,body,date:new Date().toISOString().slice(0,10),status:'Pending',adminReply:''});save();toast('Your message has been sent to the administrator.');renderVolunteer();return false}
function replyAdminMessage(e,id){e.preventDefault();const m=(db.messages||[]).find(x=>x.id===id);if(!m)return false;const f=new FormData(e.target);m.adminReply=String(f.get('reply')||'').trim();m.status='Handled';m.repliedAt=new Date().toISOString().slice(0,10);save();toast('Administrator reply saved.');renderAdmin();return false}
function markMessageHandled(id){const m=(db.messages||[]).find(x=>x.id===id);if(!m)return;m.status='Handled';m.handledAt=new Date().toISOString().slice(0,10);save();toast('Message marked as handled.');renderAdmin()}
function openPasswordRequest(){modal(`<div class="p-5 sm:p-7"><div class="flex items-start justify-between gap-3"><div><span class="pill pill-purple mb-2">Account support</span><h2 class="text-2xl font-black">Request password reset</h2><p class="text-sm text-slate-500 mt-1">The administrator will verify the request. Do not include any password.</p></div><button type="button" aria-label="Close dialog" class="btn btn-soft" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button></div><form class="mt-5 space-y-4" onsubmit="return submitPasswordRequest(event)"><div><label class="label">Account type</label><select class="field" name="accountType" required><option value="volunteer">Volunteer</option><option value="espasyo">Espasyo</option><option value="equalityDesk">Equality Desk</option></select></div><div><label class="label">Full name / account holder name</label><input class="field" name="name" required placeholder="Name of the requester"></div><div><label class="label">Volunteer ID / staff username</label><input class="field" name="id" required placeholder="WE-2026-0001 or Espasyo / Equalitydesk"></div><div><label class="label">Message (optional)</label><textarea class="field" name="message" rows="2" placeholder="Additional details for the administrator"></textarea></div><button class="btn btn-primary w-full" type="submit">Send reset request</button></form></div>`)}
function submitPasswordRequest(e){e.preventDefault();const f=new FormData(e.target),id=String(f.get('id')).trim(),name=String(f.get('name')).trim(),accountType=String(f.get('accountType')||'volunteer');db.passwordRequests=db.passwordRequests||[];let matched=false;if(accountType==='volunteer')matched=db.volunteers.some(v=>v.id.toLowerCase()===id.toLowerCase()&&v.name.trim().toLowerCase()===name.toLowerCase());else{const expected=accountType==='espasyo'?'Espasyo':'Equalitydesk';matched=id.toLowerCase()===expected.toLowerCase()&&name.length>=2}if(!matched){toast('We could not match those details to the selected account type. Check the name and account ID.','error');return false}if(db.passwordRequests.some(r=>String(r.id).toLowerCase()===id.toLowerCase()&&r.status==='Pending')){toast('A password reset request for this account is already pending.','info');return false}db.passwordRequests.unshift({requestId:'PR-'+Date.now(),name,id,accountType,message:String(f.get('message')||'').trim(),date:new Date().toISOString().slice(0,10),status:'Pending'});save();closeModal();toast('Password reset request sent to the administrator.');return false}
function resolvePasswordRequest(id){const r=(db.passwordRequests||[]).find(x=>x.requestId===id);if(!r)return;if(r.accountType==='espasyo'||r.accountType==='equalityDesk'){const key=r.accountType;db.settings.locationPasswords=db.settings.locationPasswords||{espasyo:'WagaywayEquality',equalityDesk:'WagaywayEquality'};db.settings.locationPasswords[key]= 'Wagayway-'+(key==='espasyo'?'Espasyo':'EqualityDesk')+'-'+Math.random().toString(36).slice(2,8)+'!';r.status='Handled';r.handledAt=new Date().toISOString().slice(0,10);r.temporaryPassword=db.settings.locationPasswords[key];save();modal(`<div class="p-6"><h2 class="text-2xl font-black">Location password reset</h2><p class="text-sm text-slate-600 mt-2">Reset completed for ${esc(key==='espasyo'?'Espasyo':'Equality Desk')}. Share this temporary password securely with the verified account holder.</p><div class="border rounded-xl p-4 mt-4"><div class="text-xs uppercase text-slate-500 font-bold">Temporary password</div><div class="text-xl font-black mt-1">${esc(r.temporaryPassword)}</div></div><button class="btn btn-primary w-full mt-4" onclick="closeModal();renderAdmin()">Done</button></div>`);renderAdmin();return}const v=db.volunteers.find(x=>String(x.id||'').toLowerCase()===String(r.id||'').trim().toLowerCase()&&String(x.name||'').trim().toLowerCase()===String(r.name||'').trim().toLowerCase());if(!v){toast('No matching volunteer account found. Verify the name and Volunteer ID before resetting.','error');return}v.password=v.id;r.status='Handled';r.handledAt=new Date().toISOString().slice(0,10);r.resetPasswordToUsername=true;v.mustChangePassword=true;save();toast('Password reset. The volunteer can sign in using their Volunteer ID as the password, then change it in Profile.');renderAdmin()}
function changeLocationPassword(e,key){e.preventDefault();if(!session||session.type!=='locationAdmin'||session.locationKey!==key){toast('You are not authorized to change this account password.','error');return false}const f=new FormData(e.target),current=String(f.get('currentPassword')||''),next=String(f.get('newPassword')||''),confirmPw=String(f.get('confirmPassword')||'');if(current!==String(db.settings.locationPasswords?.[key]||'')){toast('Current password is incorrect.','error');return false}if(next.length<8){toast('New password must be at least 8 characters.','error');return false}if(next!==confirmPw){toast('New password and confirmation do not match.','error');return false}db.settings.locationPasswords=db.settings.locationPasswords||{};db.settings.locationPasswords[key]=next;save();toast('Password changed successfully.');renderLocationAdmin();return false}
function toggleAnnouncement(id){const a=(db.settings.announcements||[]).find(x=>x.id===id);if(a){a.published=a.published===false;save();renderAdmin()}}
function deleteAnnouncement(id){db.settings.announcements=(db.settings.announcements||[]).filter(x=>x.id!==id);save();renderAdmin()}
function toggleArchiveEvent(id){const e=db.events.find(x=>x.id===id);if(e){e.archived=!e.archived;save();toast(e.archived?'Project archived.':'Project restored.');renderAdmin()}}
function deleteEvent(id){const e=db.events.find(x=>x.id===id);if(!e)return;if(!confirm('Permanently delete project “'+e.title+'”? This also removes its project tasks from the available project list. Existing submissions will be retained for records.'))return;db.events=db.events.filter(x=>x.id!==id);save();toast('Project deleted.');renderAdmin()}
document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.shiftKey&&e.key.toLowerCase()==='a'){go('admin')}});document.getElementById('yearNow').textContent=new Date().getFullYear();updateHeader();if(session?.type==='volunteer'){const rv=volunteerById(session.id);if(!rv||rv.status!=='Active'){session=null;persistVolunteerSession()}else{persistVolunteerSession();resetVolunteerInactivityTimer()}}if((location.hash==='#admin'&&session?.type==='admin'&&adminUnlocked)||session?.type==='locationAdmin'){go('admin')}else if(session?.type==='volunteer'){go('volunteer')}else{go(session?.type==='admin'&&adminUnlocked?'admin':'public')}
</script>
</body>
</html>
