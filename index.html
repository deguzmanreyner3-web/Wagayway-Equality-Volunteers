<style>
:root{--ink:#211b36;--muted:#746d87;--line:#ece8f3;--purple:#6d28d9;--pink:#ec4899}
*{box-sizing:border-box}body{margin:0;background:#f8f7fc;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.pride-bar{height:6px;background:linear-gradient(90deg,#e11d48 0 16.6%,#f97316 16.6% 33.2%,#facc15 33.2% 49.8%,#22c55e 49.8% 66.4%,#3b82f6 66.4% 83%,#8b5cf6 83%)}
.glass{background:rgba(255,255,255,.82);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.8);box-shadow:0 10px 35px rgba(49,30,85,.07)}
.gradient-text{background:linear-gradient(100deg,#7c3aed,#ec4899,#f97316);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-bg{background:linear-gradient(120deg,rgba(39,19,78,.9),rgba(109,40,217,.72),rgba(236,72,153,.48)),var(--hero-image);background-size:cover;background-position:center}
.btn{border-radius:12px;padding:10px 15px;font-weight:700;transition:.2s;display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn-primary{background:linear-gradient(100deg,#6d28d9,#db2777);color:white;box-shadow:0 7px 18px #8b5cf633}.btn-primary:hover{transform:translateY(-1px);filter:brightness(1.05)}.btn-soft{background:#f1eafe;color:#5b21b6}.btn-line{border:1px solid #e6e0ef;background:white;color:#514665}.btn-danger{background:#fff0f3;color:#be123c}
.card{background:white;border:1px solid var(--line);border-radius:20px;box-shadow:0 8px 28px rgba(49,30,85,.045)}.nav-btn{padding:10px 13px;border-radius:12px;color:#746d87;font-weight:700;white-space:nowrap}.nav-btn.active{background:#f1eafe;color:#6d28d9}
.field{width:100%;border:1px solid #e3ddec;border-radius:11px;padding:11px 12px;background:#fff;outline:none;color:#211b36}.field:focus{border-color:#a78bfa;box-shadow:0 0 0 3px #8b5cf622}.label{display:block;font-size:12px;font-weight:800;color:#655b79;margin-bottom:6px;letter-spacing:.02em}
.metric{border-radius:17px;padding:18px;background:linear-gradient(145deg,#fff,#faf7ff);border:1px solid #eee8f7}.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#ede9fe,#fce7f3);color:#6d28d9;font-weight:900;overflow:hidden;flex-shrink:0}.avatar img{width:100%;height:100%;object-fit:cover}.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800}.pill-green{background:#dcfce7;color:#166534}.pill-yellow{background:#fef3c7;color:#92400e}.pill-red{background:#ffe4e6;color:#9f1239}.pill-purple{background:#ede9fe;color:#5b21b6}.pill-gray{background:#f1f0f5;color:#625a72}
.modal-wrap{position:fixed;inset:0;background:rgba(24,15,41,.52);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}.modal{width:min(720px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:22px;box-shadow:0 30px 90px #160b2d44;animation:pop .2s ease}.modal-wide{width:min(1000px,100%)}@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:none}}.toast{position:fixed;right:20px;top:20px;z-index:100;min-width:260px;max-width:calc(100vw - 40px);padding:13px 16px;border-radius:14px;color:#fff;box-shadow:0 12px 35px #24153a30;animation:pop .2s}.hidden{display:none!important}.section-title{font-size:22px;font-weight:900;letter-spacing:-.03em}.small-muted{font-size:13px;color:var(--muted)}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:650px}th{text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:#8a8199;background:#faf9fc;padding:13px 14px}td{padding:13px 14px;border-top:1px solid #f0edf5;font-size:13px;vertical-align:middle}.event-image{height:150px;object-fit:cover;width:100%;border-radius:14px;background:#eee}.side-panel{position:fixed;inset:0 0 0 auto;width:min(410px,100%);background:#fff;z-index:60;box-shadow:-15px 0 50px #25133c22;overflow:auto;padding:24px;animation:slide .22s}@keyframes slide{from{transform:translateX(30px);opacity:.5}to{transform:none}}.id-card{background:linear-gradient(130deg,#2e1659,#6d28d9 55%,#db2777);color:#fff;border-radius:22px;padding:22px;position:relative;overflow:hidden}.id-card:after{content:"";position:absolute;width:220px;height:220px;border:24px solid #ffffff12;border-radius:50%;right:-65px;top:-80px}.id-card>*{position:relative;z-index:1}.chart-box{height:250px;position:relative}.mobile-menu{display:none}@media(max-width:760px){.desktop-nav{display:none}.mobile-menu{display:inline-flex}.hero-content{padding:28px!important}.section-title{font-size:20px}.chart-box{height:220px}.hide-mobile{display:none!important}} 

/* Navigation usability improvements */
.portal-jumpbar{position:sticky;top:76px;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border:1px solid #eee8f7;border-radius:16px;padding:10px;margin:0 0 18px;box-shadow:0 8px 24px #2e16590b}
.portal-jumpbar .jump-label{font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#8a8199;padding:0 8px 7px}
.portal-jumpbar .jump-links{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.portal-jumpbar .jump-link{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;border:1px solid #e9e2f2;border-radius:10px;padding:9px 12px;font-size:12px;font-weight:800;color:#514568;background:#fff;transition:.15s}
.portal-jumpbar .jump-link:hover,.portal-jumpbar .jump-link:focus{background:#f5f0ff;border-color:#c4b5fd;color:#5b21b6;outline:none}
.portal-jumpbar .jump-count{display:inline-grid;place-items:center;min-width:19px;height:19px;border-radius:999px;padding:0 5px;background:#fef3c7;color:#92400e;font-size:10px;font-weight:900}
@media(max-width:760px){.portal-jumpbar{top:66px;margin-left:-2px;margin-right:-2px;padding:8px}.portal-jumpbar .jump-link{padding:9px 10px}.portal-jumpbar .jump-label{padding-left:5px}}
html{scroll-behavior:smooth;scroll-padding-top:145px}


.volunteer-expand-body.is-collapsed{max-height:360px;overflow:hidden;position:relative}.volunteer-expand-body.is-collapsed:after{content:'';position:absolute;left:0;right:0;bottom:0;height:58px;background:linear-gradient(transparent,var(--card,#fff));pointer-events:none}.jump-link.active{background:#ede9fe;color:#5b21b6;border-color:#c4b5fd;font-weight:800}
</style>

</style>

function trackHomeVisitor(){
 const stats=readVisitorStats();
 if(!stats.visitorId){stats.visitorId='VIS-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10);}
 const now=new Date(),month=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
 stats.months=stats.months||{};stats.knownVisitors=stats.knownVisitors||[];
 if(!stats.knownVisitors.includes(stats.visitorId))stats.knownVisitors.push(stats.visitorId);
 if(!stats.months[month])stats.months[month]={visitors:[],pageViews:0};
 if(!stats.months[month].visitors.includes(stats.visitorId))stats.months[month].visitors.push(stats.visitorId);

function ensureMonthlyCycle(){const now=new Date(),key=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;if(db.monthKey!==key){const previousMonth=db.monthKey||new Date(now.getFullYear(),now.getMonth()-1,1).toISOString().slice(0,7);const winner=db.volunteers.filter(v=>v.status==='Active'&&Number(v.monthPoints||0)>0).sort((a,b)=>Number(b.monthPoints||0)-Number(a.monthPoints||0)||String(a.name).localeCompare(String(b.name)))[0];db.monthlyWinners=db.monthlyWinners||[];if(winner&&!db.monthlyWinners.some(w=>w.month===previousMonth)){db.monthlyWinners.push({month:previousMonth,volunteerId:winner.id,name:winner.name,alias:winner.alias||'',points:Number(winner.monthPoints||0),photo:winner.photo||'',location:winner.location||''});}db.volunteers.forEach(v=>{v.monthPoints=0;v.points=0});db.submissions.forEach(x=>{if(x.status==='Approved')x.monthKey=x.monthKey||previousMonth});db.monthKey=key;save();}}

function volunteerPointHistory(id){const rows=[];volunteerSubs(id).forEach(s=>{const date=s.revokedAt||s.approvedAt||s.reviewedAt||s.submittedAt||s.createdAt||s.date||'';let change=0,status=s.status||'Pending';if(s.pointsRevoked){change=-Math.abs(Number(s.revokedPoints||0));status='Points Revoked'}else if(s.status==='Approved'){change=Number(s.points||0)}rows.push({date,source:`Activity: ${s.taskTitle||s.title||'Volunteer activity'}`,role:s.role||'—',change,status,details:s.pointsRevoked?(s.revocationReason||'Points revoked'):s.note||'—',reference:s.id||''})});scannerCheckins().filter(c=>c.volunteerId===id).forEach(c=>rows.push({date:c.scannedAt||c.date||'',source:`QR Check-in: ${c.scannerName||(c.scanner==='espasyo'?'Espasyo':'Equality Desk')}`,role:'Location check-in',change:Number(c.points||20),status:'Awarded',details:'Daily QR check-in',reference:c.id||''}));const submissionIds=new Set(volunteerSubs(id).map(s=>s.id));(db.pointAudit||[]).filter(a=>a.volunteerId===id&&a.amount&&!/daily QR check-in/i.test(String(a.reason||''))&&!submissionIds.has(a.submissionId)).forEach(a=>{const reward=/Referral reward/i.test(String(a.reason||''));rows.push({date:a.date||'',source:reward?'Referral reward':'Point adjustment',role:'—',change:reward?Math.abs(Number(a.amount||0)):-Math.abs(Number(a.amount||0)),status:reward?'Awarded':'Adjusted',details:a.reason||'Adjustment recorded',reference:a.id||''})});return rows.sort((a,b)=>String(b.date).localeCompare(String(a.date)))}

function updateVolunteerActivityStatuses(){const today=new Date();let changed=false;db.volunteers.forEach(v=>{if(v.status==='Archived')return;const last=volunteerLastParticipation(v);const cutoff=new Date(today);cutoff.setMonth(cutoff.getMonth()-1);const isInactive=!last||new Date(last+'T23:59:59')<cutoff;const next=isInactive?'Inactive':'Active';if(v.status!==next){v.status=next;changed=true}v.lastParticipationDate=last||null});if(changed)save()}
function pointLedgerEntries(){const rows=[];allSubs().forEach(s=>{const v=volunteerById(s.volunteerId);const pts=Number(s.points||0);if(pts||s.status==='Approved'||s.pointsRevoked)rows.push({date:s.approvedAt||s.reviewedAt||s.submittedAt||s.createdAt||s.date||s.monthKey||'',volunteerId:s.volunteerId,name:v?.name||'Unknown volunteer',source:`Activity: ${s.taskTitle||s.title||'Volunteer activity'}`,reference:s.id||'',awarded:s.pointsRevoked?0:s.status==='Approved'?pts:0,status:s.pointsRevoked?'Revoked':s.status||'Pending',reason:s.pointsRevoked?(s.revocationReason||'Points revoked'):s.note||''})});scannerCheckins().forEach(c=>{const v=volunteerById(c.volunteerId);rows.push({date:c.scannedAt||c.date||'',volunteerId:c.volunteerId,name:v?.name||'Unknown volunteer',source:`QR check-in: ${c.scannerName|| (c.scanner==='espasyo'?'Espasyo':'Equality Desk')}`,reference:c.id||'',awarded:Number(c.points||20),status:'Awarded',reason:'Daily location check-in'})});(db.pointAudit||[]).forEach(a=>{if(!a.amount||/daily QR check-in/i.test(String(a.reason||'')))return;const reward=/Referral reward/i.test(String(a.reason||''));rows.push({date:a.date||'',volunteerId:a.volunteerId,name:volunteerById(a.volunteerId)?.name||'Unknown volunteer',source:reward?'Referral reward':'Point adjustment / revocation',reference:a.id||a.submissionId||'',awarded:reward?Math.abs(Number(a.amount||0)):-Math.abs(Number(a.amount||0)),status:reward?'Awarded':'Adjusted',reason:a.reason||''})});return rows.sort((a,b)=>String(b.date).localeCompare(String(a.date)))}
function downloadAllAnalyticsReport(){const month=db.monthKey||new Date().toISOString().slice(0,7),stats=visitorStats(),monthVisitors=(stats.months||{})[month]||{visitors:[],pageViews:0},vols=db.volunteers,active=vols.filter(v=>v.status==='Active'),inactive=vols.filter(v=>v.status==='Inactive'),checkins=scannerCheckins().filter(c=>String(c.date||'').startsWith(month)),e=checkins.filter(c=>c.scanner==='espasyo').length,d=checkins.filter(c=>c.scanner==='equalityDesk').length;const distribution=(key)=>{const m={};vols.forEach(v=>{const k=String(v[key]||'Not provided');m[k]=(m[k]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<tr><td>${esc(k)}</td><td>${n}</td><td>${vols.length?Math.round(n/vols.length*100):0}%</td></tr>`).join('')||'<tr><td colspan="3">No data</td></tr>'};const top=vols.slice().sort((a,b)=>Number(b.monthPoints||0)-Number(a.monthPoints||0)).slice(0,10),ledger=pointLedgerEntries();const w=window.open('','_blank');if(!w){toast('Please allow pop-ups to export the full analytics report.','error');return}w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Wagayway Complete Analytics - ${esc(month)}</title><style>body{font:12px Arial,sans-serif;color:#1e293b;padding:24px}h1{margin-bottom:4px}h2{margin-top:26px;border-bottom:2px solid #7c3aed;padding-bottom:6px}p{color:#64748b}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.metric{border:1px solid #cbd5e1;border-radius:8px;padding:12px}.metric b{font-size:20px;display:block;margin-top:6px}table{border-collapse:collapse;width:100%;margin:12px 0 22px}th,td{border:1px solid #cbd5e1;padding:6px;text-align:left;vertical-align:top}th{background:#f1f5f9}.note{font-size:10px;color:#64748b}.pagebreak{page-break-before:always}@media print{button{display:none}}</style></head><body><h1>Wagayway Equality Inc.</h1><h2>Complete Analytics & Volunteer Points Report</h2><p>Reporting month: ${esc(monthLabel(month))} · Generated ${new Date().toLocaleString('en-PH')}</p><div class="metrics"><div class="metric">Website unique visitors this month<b>${(monthVisitors.visitors||[]).length}</b></div><div class="metric">Homepage views this month<b>${Number(monthVisitors.pageViews||0)}</b></div><div class="metric">Espasyo check-ins<b>${e}</b></div><div class="metric">Equality Desk check-ins<b>${d}</b></div><div class="metric">Registered volunteers<b>${vols.length}</b></div><div class="metric">Active volunteers<b>${active.length}</b></div><div class="metric">Inactive volunteers<b>${inactive.length}</b></div><div class="metric">Total recorded point entries<b>${ledger.length}</b></div></div><h2>Most Engaged Volunteers — Current Month</h2><table><thead><tr><th>Rank</th><th>Name</th><th>Volunteer ID</th><th>Current-month points</th><th>Status</th></tr></thead><tbody>${top.map((v,i)=>`<tr><td>${i+1}</td><td>${esc(v.name)}</td><td>${esc(v.id)}</td><td>${Number(v.monthPoints||0)}</td><td>${esc(v.status||'')}</td></tr>`).join('')||'<tr><td colspan="5">No volunteers yet.</td></tr>'}</tbody></table><h2>Gender Distribution</h2><table><thead><tr><th>Gender</th><th>Volunteers</th><th>Share</th></tr></thead><tbody>${distribution('gender')}</tbody></table><h2>SOGIESC Distribution</h2><table><thead><tr><th>Category</th><th>Volunteers</th><th>Share</th></tr></thead><tbody>${distribution('sogiesc')}</tbody></table><h2>Educational Attainment Distribution</h2><table><thead><tr><th>Category</th><th>Volunteers</th><th>Share</th></tr></thead><tbody>${distribution('education')}</tbody></table><div class="pagebreak"></div><h2>Volunteer Points Ledger — All Recorded Sources</h2><p>Positive entries show awards. Negative entries show revocations/adjustments. Pending submissions are not counted as awarded points.</p><table><thead><tr><th>Date</th><th>Volunteer</th><th>ID</th><th>Source / Activity</th><th>Reference</th><th>Points change</th><th>Status</th><th>Reason / details</th></tr></thead><tbody>${ledger.map(r=>`<tr><td>${esc(r.date)}</td><td>${esc(r.name)}</td><t const cohorts={};db.volunteers.forEach(v=>{const m=(v.id||'').match(/^WE-(\d{4})-/);if(m)cohorts[m[1]]=(cohorts[m[1]]||0)+1});const c=document.getElementById('cohortChart');if(c)charts.push(new Chart(c,{type:'doughnut',data:{labels:Object.keys(cohorts).sort(),datasets:[{data:Object.keys(cohorts).sort().map(k=>cohorts[k]),backgroundColor:['#7c3aed','#ec4899','#f59e0b','#10b981','#3b82f6'],borderWidth:3,borderColor:'#fff'}]},options:{maintainAspectRatio:false,plugins:{legend:{position:'bottom'},tooltip:{callbacks:{label:x=>`${x.label}: ${x.raw} volunteer(s)`}}},cutout:'62%'}}))}
function eventCard(e){const count=e.tasks.filter(t=>!allSubs().some(s=>s.taskId===t.id&&s.status==='Approved')).length;return `<article class="card p-4 flex flex-col"><img class="event-image" src="${esc(e.image||'https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&fit=crop&w=900&q=80')}" alt="${esc(e.title)}"><div class="flex flex-wrap gap-2 mt-4"><span class="pill pill-purple"><i class="fa-regular fa-calendar"></i> ${fmtDate(e.date)}</span><span class="pill pill-gray"><i class="fa-solid fa-location-dot"></i> ${esc(e.location)}</span></div><h3 class="font-black text-lg mt-3">${esc(e.title)}</h3><p class="text-sm text-slate-500 mt-2 leading-relaxed flex-1">${esc(e.description.length>125?e.description.slice(0,125)+'…':e.description)}</p><div class="flex items-center justify-between mt-4 pt-3 border-t border-slate-100"><span class="text-xs font-bold text-violet-700"><i class="fa-solid fa-list-check mr-1"></i>${e.tasks.length} task options</span><button class="btn btn-soft text-xs" onclick="showEvent('${e.id}')">Read more <i class="fa-solid fa-arrow-right"></i></button></div></article>`}
function showEvent(id){const e=db.events.find(x=>x.id===id);if(!e)return;modal(`<div class="p-5 sm:p-7"><div class="flex justify-between items-start gap-3"><div><span class="pill pill-purple mb-3">Community initiative</span><h2 class="text-2xl font-black">${esc(e.title)}</h2></div><button type="button" aria-label="Close dialog" class="btn btn-soft" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button></div><img class="event-image mt-4" style="height:220px" src="${esc(e.image)}"><div class="flex flex-wrap gap-3 mt-4 text-sm text-slate-600"><span><i class="fa-regular fa-calendar text-violet-600 mr-1"></i>${fmtDate(e.date)}</span><span><i class="fa-solid fa-location-dot text-violet-600 mr-1"></i>${esc(e.location)}</span></div><p class="leading-relaxed text-slate-600 mt-4">${esc(e.description)}</p><h3 class="font-black text-lg mt-6 mb-3">Volunteer task opportunities</h3><div class="space-y-3">${e.tasks.map(t=>`<div class="border rounded-xl p-4 flex flex-col sm:flex-row sm:items-center gap-3 justify-between"><div><div class="font-bold">${esc(t.title)}</div><p class="text-sm text-slate-500 mt-1">${esc(t.description)}</p></div><div class="flex items-center gap-3"><span class="pill pill-purple">${t.points} pts</span><button class="btn btn-primary text-xs" onclick="closeModal();go('volunteer')">Join task</button></div></div>`).join('')}</div><div class="mt-6 flex justify-end"><button class="btn btn-line" onclick="closeModal()">Close</button></div></div>`,true)}
function destroyCharts(){charts.forEach(c=>{try{c.destroy()}catch(e){}});charts=[]}
function titleCaseWords(value){return String(value||'').trim().toLowerCase().replace(/\b([a-z])/g,m=>m.toUpperCase())}
function profileCompletion(v){const fields=[['Full name',v.name],['Preferred alias',v.alias],['Active email',v.email],['Birthdate',v.birthdate],['SOGIESC',v.sogiesc],['Education',v.education],['Municipality / City',v.location],['Skills',v.skills],['Professional summary',v.profileSummary],['Affiliations and organizations',(Array.isArray(v.affiliations)?v.affiliations:[]).length],['Profile photo',v.photo]];const done=fields.filter(([,value])=>String(value||'').trim()).length;return {done,total:fields.length,percent:Math.round(done/fields.length*100),missing:fields.filter(([,value])=>!String(value||'').trim()).map(([name])=>name)}}

function applyVolunteerPage(){const app=document.getElementById('app');if(!app)return;const map={dashboard:['volunteer-notification-center'],activities:['opportunities','volunteer-workflow'],certificates:['certificates'],achievements:['achievements'],messages:['admin-messages'],report:['engagement-report'],profile:['volunteer-resume-profile']};const selected=map[volunteerPage]||map.dashboard;const managedIds=['volunteer-notification-center','certificates','achievements','admin-messages','engagement-report','opportunities','volunteer-workflow','volunteer-resume-profile'];const navBarEl=app.querySelector('.portal-jumpbar');const heading=app.querySelector('#volunteerPageHeading');Array.from(app.children).forEach(node=>{if(node===navBarEl||node===heading)return;const id=node.id||'';const nestedManaged=node.querySelector&&node.querySelector(managedIds.map(x=>'#'+x).join(','));if(volunteerPage==='dashboard'){if(managedIds.includes(id))node.style.display=selected.includes(id)?'':'none';else if(nestedManaged){node.style.display='';managedIds.forEach(mid=>{const el=node.querySelector('#'+mid);if(el)el.style.display=selected.includes(mid)?'':'none'});}else node.style.display='';}else{if(managedIds.includes(id))node.style.display=selected.includes(id)?'':'none';else if(nestedManaged){node.style.display='';Array.from(node.children).forEach(child=>{if(managedIds.includes(child.id))child.style.display=selected.includes(child.id)?'':'none';else child.style.display='none'});}else node.style.display='none';}});app.querySelectorAll('section[id]').forEach(sec=>{if(managedIds.includes(sec.id))sec.style.display=selected.includes(sec.id)?'':'none'});const names={dashboard:['Dashboard','Your updates and volunteer overview.'],activities:['Activities','Explore opportunities and review your submissions.'],certificates:['Certificates','Request and track certificate issuance.'],achievements:['Achievements','View certificates officially released to you.'],messages:['Messages','Contact the administrator and read replies.'],report:['Engagement Report','Review your monthly participation and points.'],profile:['Volunteer Profile','Your resume-style profile, personal details, skills, and organizational affiliations.']};const nav=app.querySelector('.portal-jumpbar');if(nav){let h=app.querySelector('#volunteerPageHeading');if(!h){h=document.createElement('div');h.id='volunteerPageHeading';h.className='card p-4 mt-4 mb-4';nav.insertAdjacentElement('afterend',h)}const n=names[volunteerPage]||names.dashboard;h.innerHTML=`<div class="text-xs font-bold uppercase tracking-wide text-purple-700">Volunteer Portal / ${n[0]}</div><h2 class="text-xl font-black mt-1">${n[0]}</h2><p class="small-muted mt-1">${n[1]}</p>`;app.querySelectorAll('.jump-link').forEach(b=>{b.classList.toggle('active',b.textContent.trim().toLowerCase().startsWith(n[0].toLowerCase()))})}app.querySelectorAll('section[id]').forEach(sec=>{if(!selected.includes(sec.id)||sec.style.display==='none')return;let body=sec.querySelector('.volunteer-expand-body');if(!body){body=document.createElement('div');body.className='volunteer-expand-body';while(sec.children.length>1){const child=sec.children[1];if(child.id==='volunteerExpandToggle')break;body.appendChild(child)}sec.appendChild(body)}let btn=sec.querySelector('#volunteerExpandToggle');if(!btn){btn=document.createElement('button');btn.id='volunteerExpandToggle';btn.className='btn btn-line text-xs mt-3';btn.type='button';btn.textContent='Show less';btn.onclick=()=>{const collapsed=body.classList.toggle('is-collapsed');btn.textContent=collapsed?'Show all':'Show less'};sec.appendChild(btn)}body.classList.add('is-collapsed');btn.textContent='Show all';});}

function previewProfilePhoto(event){const f=event.target.files?.[0];if(!f)return;if(!f.type.startsWith('image/')){toast('Please choose an image file.','error');event.target.value='';return}if(f.size>850000){toast('Please choose an image under 850 KB.','error');event.target.value='';return}const r=new FileReader();r.onload=()=>{pendingProfilePhoto=r.result;const p=document.getElementById('profilePhotoPreview');if(p)p.innerHTML=`<img src="${pendingProfilePhoto}" class="w-20 h-20 object-cover rounded-xl border">`};r.readAsDataURL(f)}

function requestCertificate(e){e.preventDefault();const v=volunteerById(session?.id),f=new FormData(e.target),certificateId=String(f.get('certificateId')||''),c=(db.certificates||[]).find(x=>x.id===certificateId&&x.active!==false);if(!v||!c)return false;if((db.certificateRequests||[]).some(r=>r.volunteerId===v.id&&r.certificateId===certificateId)){toast('You have already requested this certificate. Each volunteer may request each certificate only once.','error');return false}db.certificateRequests=db.certificateRequests||[];db.certificateRequests.push({id:'CR-'+Date.now(),volunteerId:v.id,certificateId,status:'Pending',requestedAt:new Date().toISOString().slice(0,10),note:''});save();toast('Certificate issuance request sent for review.');renderVolunteer();return false}
function uploadCertificate(e){e.preventDefault();const f=new FormData(e.target),title=titleCaseWords(String(f.get('title')||'')),file=f.get('image');if(!file||!file.size)return false;if(!['image/jpeg'].includes(file.type)&&!(/\.jpe?g$/i).test(file.name)){toast('Please upload a JPG/JPEG image.','error');return false}if(file.size>2000000){toast('JPG image must be 2 MB or smaller for browser storage.','error');return false}const reader=new FileReader();reader.onload=()=>{const imageData=String(reader.result);const img=new Image();img.onload=()=>{try{const canvas=document.createElement('canvas'),maxW=1600,maxH=2200,scale=Math.min(1,maxW/img.width,maxH/img.height);canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);const jpg=canvas.toDataURL('image/jpeg',0.88);db.certificates=db.certificates||[];db.certificates.push({id:'CERT-'+Date.now(),title,filename:file.name.replace(/\.(jpe?g)$/i,'.jpg'),data:jpg,previewJpg:jpg,active:true,uploadedAt:new Date().toISOString().slice(0,10)});save();closeModal();toast('JPG certificate uploaded successfully.');renderAdmin()}catch(err){toast('Could not save this JPG. Try a smaller image.','error')}};img.onerror=()=>toast('Could not read this image. Please choose a valid JPG file.','error');img.src=imageData};reader.readAsDataURL(file);return false}

function deleteCertificate(id){const c=(db.certificates||[]).find(x=>x.id===id);if(!c)return;if(!confirm('Delete this certificate? It will also disappear from all volunteer Certificates and Achievements pages.'))return;db.certificates=(db.certificates||[]).filter(x=>x.id!==id);(db.certificateRequests||[]).filter(r=>r.certificateId===id).forEach(r=>{r.status='Certificate Removed';r.removedAt=new Date().toISOString().slice(0,10);r.note='Certificate removed by administrator.'});db.certificateAudit=db.certificateAudit||[];db.certificateAudit.push({id:'CA-'+Date.now(),certificateId:id,action:'Deleted',reason:'Certificate removed from Admin Control',date:new Date().toISOString().slice(0,10),by:'Administrator'});save();toast('Certificate removed from Admin Control and volunteer certificate/achievement views.');renderAdmin()}
function editCertificate(id){const c=(db.certificates||[]).find(x=>x.id===id);if(!c)return;modal(`<div class="p-6"><div class="flex justify-between items-center gap-3"><h2 class="text-2xl font-black">Edit Certificate</h2><button type="button" class="btn btn-soft" onclick="closeModal()" aria-label="Close dialog"><i class="fa-solid fa-xmark"></i></button></div><form class="mt-5 space-y-4" onsubmit="return saveCertificateEdit(event,'${c.id}')"><div><label class="label">Certificate Title</label><input class="field" name="title" required maxlength="120" value="${esc(c.title)}"></div><div><label class="label">Replace JPG Image (Optional)</label><input class="field" name="image" type="file" accept="image/jpeg,.jpg,.jpeg"><p class="text-xs text-slate-500 mt-1">Choose a new JPG to replace the existing image. Maximum 2 MB.</p></div>${c.previewJpg?`<img src="${c.previewJpg}" alt="Current certificate image" class="max-h-64 rounded-lg border bg-white">`:''}<button class="btn btn-primary w-full" type="submit">Save Certificate Changes</button></form></div>`,true)}
function saveCertificateEdit(e,id){e.preventDefault();const c=(db.certificates||[]).find(x=>x.id===id);if(!c)return false;const f=new FormData(e.target),title=titleCaseWords(String(f.get('title')||'')),file=f.get('image');if(!title){toast('Enter a certificate title.','error');return false}const saveChanges=(jpg)=>{c.title=title;if(jpg){c.data=jpg;c.previewJpg=jpg;c.filename=(c.filename||'certificate.jpg').replace(/\.(jpe?g|pdf)$/i,'')+'.jpg'}c.updatedAt=new Date().toISOString().slice(0,10);save();closeModal();toast('Certificate updated successfully.');renderAdmin()};if(file&&file.size){if((file.type!=='image/jpeg'&&!/\.jpe?g$/i.test(file.name))||file.size>2000000){toast('Choose a JPG/JPEG image no larger than 2 MB.','error');return false}const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const canvas=document.createElement('canvas'),scale=Math.min(1,1600/img.width,2200/img.height);canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);saveChanges(canvas.toDataURL('image/jpeg',0.88))};img.onerror=()=>toast('Could not read the selected JPG.','error');img.src=String(reader.result)};reader.readAsDataURL(file)}else saveChanges('');return false}
function revokeCertificate(requestId){const r=(db.certificateRequests||[]).find(x=>x.id===requestId);if(!r||r.status!=='Released')return;if(!confirm('Revoke this released certificate? The volunteer will lose active achievement display and download access.'))return;const reason=prompt('Enter the reason for revocation (required):');if(reason===null)return;if(!String(reason).trim()){toast('A reason is required to revoke a released certificate.','error');return}r.status='Revoked';r.revokedAt=new Date().toISOString().slice(0,10);r.revocationReason=String(reason).trim();r.note='Certificate revoked by administrator: '+r.revocationReason;db.certificateAudit=db.certificateAudit||[];db.certificateAudit.push({id:'CA-'+Date.now(),requestId:r.id,certificateId:r.certificateId,volunteerId:r.volunteerId,action:'Revoked',reason:r.revocationReason,date:r.revokedAt,by:'Administrator'});save();toast('Released certificate revoked and recorded.');renderAdmin()}
function reviewCertificateRequest(id,status){const r=(db.certificateRequests||[]).find(x=>x.id===id);if(!r)return;if(status==='Approved'&&r.status==='Pending'){r.status='Approved';r.reviewedAt=new Date().toISOString().slice(0,10);r.note='Validated by administrator; awaiting release.'}else if(status==='Declined'&&r.status==='Pending'){r.status='Declined';r.reviewedAt=new Date().toISOString().slice(0,10);r.note='Request declined by administrator.'}else if(status==='Released'&&r.status==='Approved'){if(!(db.certificates||[]).some(c=>c.id===r.certificateId&&c.data)){toast('The certificate JPG is no longer available.','error');return}r.status='Released';r.releasedAt=new Date().toISOString().slice(0,10);r.note='Certificate released by administrator.'}save();toast(`Certificate request ${status.toLowerCase()}.`);renderAdmin()}

function monthlyHistoryMonths(){const months=new Set([db.monthKey]);(db.submissions||[]).forEach(x=>{const m=x.monthKey||String(x.submittedAt||'').slice(0,7);if(/^\d{4}-\d{2}$/.test(m))months.add(m)});return [...months].sort((a,b)=>b.localeCompare(a))}
function monthLabel(m){if(!/^\d{4}-\d{2}$/.test(m))return m;return new Date(m+'-01T12:00:00').toLocaleDateString('en-PH',{month:'long',year:'numeric'})}
function monthlyEngagementRows(month){return db.volunteers.map(v=>{const list=(db.submissions||[]).filter(x=>x.volunteerId===v.id&&(x.monthKey||String(x.submittedAt||'').slice(0,7))===month);const approved=list.filter(x=>x.status==='Approved');return {v,submissionCount:list.length,approvedCount:approved.length,pendingCount:list.filter(x=>x.status==='Pending').length,declinedCount:list.filter(x=>x.status==='Declined').length,points:approved.reduce((n,x)=>n+Math.max(0,Number(x.points||0)),0)}}).sort((a,b)=>b.points-a.points||b.approvedCount-a.approvedCount||String(a.v.name).localeCompare(String(b.v.name)))}
function monthlyHistoryTable(month){const rows=monthlyEngagementRows(month).filter(r=>r.submissionCount>0||r.points>0);return rows.length?rows.map((r,i)=>`<tr><td><span class="pill ${i===0&&r.points>0?'pill-green':'pill-gray'}">${r.points>0?'#'+(i+1):'—'}</span></td><td class="font-bold">${esc(r.v.name)} <div class="text-xs text-slate-400">${esc(r.v.alias||'')}</div></td><td>${esc(r.v.id)}</td><td>${r.submissionCount}</td><td>${r.approvedCount}</td><td>${r.pendingCount}</td><td>${r.declinedCount}</td><td class="font-black text-violet-700">${r.points.toLocaleString()}</td></tr>`).join(''):'<tr><td colspan="8" class="text-center text-slate-400 py-6">No volunteer submissions recorded for this month.</td></tr>'}
function updateMonthlyHistory(){const month=document.getElementById('historyMonth')?.value||db.monthKey;const rows=monthlyEngagementRows(month);document.getElementById('monthlyHistoryBody').innerHTML=monthlyHistoryTable(month);document.getElementById('historyActiveCount').textContent=rows.filter(r=>r.approvedCount>0).length;document.getElementById('historyPoints').textContent=rows.reduce((n,r)=>n+r.points,0).toLocaleString()}
function engagementMonthSummary(month){const rows=monthlyEngagementRows(month);const submissions=(db.submissions||[]).filter(x=>(x.monthKey||String(x.submittedAt||'').slice(0,7))===month);return {month,active:rows.filter(r=>r.approvedCount>0).length,points:rows.reduce((n,r)=>n+r.points,0),approved:submissions.filter(x=>x.status==='Approved').length,pending:submissions.filter(x=>x.status==='Pending').length,declined:submissions.filter(x=>x.status==='Declined').length,submissions:submissions.length}}

function processVolunteerQr(rawId,scannerKey=activeScannerLocation){if(session?.type==='locationAdmin'&&scannerKey!==session.locationKey){toast('This account can only check in volunteers at its assigned location.','error');return}const cfg=QR_SCANNERS[scannerKey]||QR_SCANNERS.espasyo,id=String(rawId||'').trim(),host=document.getElementById('volunteerQrResult');if(!host)return;const stamp=Date.now();if(id&&id===lastQrScanValue&&stamp-lastQrScanAt<2500)return;lastQrScanValue=id;lastQrScanAt=stamp;if(!id){toast('Scan a QR code or enter a Volunteer ID.','error');return}const v=volunteerById(id);if(!v){host.innerHTML='<div class="rounded-xl bg-rose-50 text-rose-800 p-4">No volunteer was found for ID <b>'+esc(id)+'</b>.</div>';return}if(v.status!=='Active'){host.innerHTML='<div class="rounded-xl bg-amber-50 text-amber-800 p-4">This account is not active. No check-in points were awarded.</div>';return}const now=new Date(),today=dateKey(now),rows=scannerCheckins(),already=rows.some(x=>x.volunteerId===v.id&&x.scanner===cfg.key&&x.date===today);if(!already){const entry={id:'SCAN-'+Date.now(),volunteerId:v.id,scanner:cfg.key,scannerName:cfg.name,date:today,points:20,scannedAt:now.toISOString(),scannedBy:'Administrator'};rows.push(entry);v.points=totalPoints(v)+20;v.monthPoints=Number(v.monthPoints||0)+20;db.pointAudit=db.pointAudit||[];db.pointAudit.push({id:'PA-SCAN-'+Date.now(),volunteerId:v.id,amount:20,reason:`${cfg.name} daily QR check-in`,date:today,by:'Administrator'});const referralRewarded=checkReferralReward(v.id);save();toast(`${cfg.name}: 20 points awarded to ${v.name}.${referralRewarded?' Referral reward of 50 points also awarded.':''}`)}else toast(`This volunteer has already checked in at ${cfg.name} today.`,'info');host.innerHTML=`<div class="rounded-2xl border p-4 flex items-center gap-4"><div class="shrink-0">${v.photo?`<img src="${esc(v.photo)}" alt="${esc(v.name)}" class="w-20 h-20 rounded-xl object-cover">`:`<div class="w-20 h-20 rounded-xl bg-violet-100 te <section class="card mt-6 p-5 sm:p-6" id="admin-all-analytics"><div class="flex flex-col sm:flex-row sm:items-start justify-between gap-3"><div><div class="section-title">Complete Analytics Summary</div><p class="small-muted mt-1">One consolidated overview of website traffic, both QR locations, volunteer status, engagement, SOGIESC, education, and point-award sources.</p></div><button class="btn btn-primary" onclick="downloadAllAnalyticsReport()"><i class="fa-solid fa-file-pdf"></i> Download All Analytics (PDF)</button></div><div class="grid sm:grid-cols-2 xl:grid-cols-4 gap-3 mt-4"><div class="metric"><div class="text-xs font-bold text-slate-500">WEBSITE UNIQUE VISITORS · THIS MONTH</div><div class="text-3xl font-black mt-2">${(((visitorStats().months||{})[db.monthKey]||{}).visitors||[]).length}</div></div><div class="metric"><div class="text-xs font-bold text-slate-500">ESPASYO VISITORS · THIS MONTH</div><div class="text-3xl font-black mt-2">${scannerCheckins().filter(c=>c.scanner==='espasyo'&&String(c.date||'').startsWith(db.monthKey)).length}</div></div><div class="metric"><div class="text-xs font-bold text-slate-500">EQUALITY DESK · THIS MONTH</div><div class="text-3xl font-black mt-2">${scannerCheckins().filter(c=>c.scanner==='equalityDesk'&&String(c.date||'').startsWith(db.monthKey)).length}</div></div><div class="metric"><div class="text-xs font-bold text-slate-500">HOME PAGE VIEWS · THIS MONTH</div><div class="text-3xl font-black mt-2">${Number((((visitorStats().months||{})[db.monthKey]||{}).pageViews)||0)}</div></div><div class="metric"><div class="text-xs font-bold text-slate-500">ACTIVE VOLUNTEERS</div><div class="text-3xl font-black mt-2">${db.volunteers.filter(v=>v.status==='Active').length}</div></div><div class="metric"><div class="text-xs font-bold text-slate-500">INACTIVE VOLUNTEERS</div><div class="text-3xl font-black mt-2">${db.volunteers.filter(v=>v.status==='Inactive').length}</div><div class="text-xs text-slate-500 mt-1">No participation in the past month</div></div><div class="metric"><div class="text-xs font-bold text-slate-500">MOST ENGAGED VOLUNTEER</div><div class="text-lg font-black mt-2">${esc(db.volunteers.slice().sort((a,b)=>Number(b.monthPoints||0)-Number(a.monthPoints||0))[0]?.name||'No volunteer records')}</div><div class="text-xs text-slate-500 mt-1">${Number(db.volunteers.slice().sort((a,b)=>Number(b.monthPoints||0)-Number(a.monthPoints||0))[0]?.monthPoints||0)} points this month</div></div><div class="metric"><div class="text-xs font-bold text-slate-500">POINT RECORDS</div><div class="text-3xl font-black mt-2">${pointLedgerEntries().length}</div><div class="text-xs text-slate-500 mt-1">Awards, QR scans, and adjustments</div></div></div><div class="grid lg:grid-cols-2 gap-5 mt-5"><div class="rounded-xl border p-4"><h3 class="font-black mb-3">SOGIESC Distribution</h3><div class="table-wrap"><table><thead><tr><th>Category</th><th>Count</th></tr></thead><tbody>${Object.entries(db.volunteers.reduce((m,v)=>{const k=v.sogiesc||'Not provided';m[k]=(m[k]||0)+1;return m},{})).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<tr><td>${esc(k)}</td><td>${n}</td></tr>`).join('')||'<tr><td colspan="2">No data</td></tr>'}</tbody></table></div></div><div class="rounded-xl border p-4"><h3 class="font-black mb-3">Educational Attainment</h3><div class="table-wrap"><table><thead><tr><th>Attainment</th><th>Count</th></tr></thead><tbody>${Object.entries(db.volunteers.reduce((m,v)=>{const k=v.education||'Not provided';m[k]=(m[k]||0)+1;return m},{})).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<tr><td>${esc(k)}</td><td>${n}</td></tr>`).join('')||'<tr><td colspan="2">No data</td></tr>'}</tbody></table></div></div></div><div class="flex flex-wrap gap-2 mt-4"><button class="btn btn-soft" onclick="openAdminPage('analytics')"><i class="fa-solid fa-chart-line"></i> Detailed Analytics</button><button class="btn btn-line" onclick="document.getElementById('admin-point-ledger').scrollIntoView({behavior:'smooth'})"><i class="fa-solid fa-coins"></i> View All Points</button></div></section>
<section class="card mt-6 p-5 sm:p-6" id="admin-point-ledger"><div class="flex flex-col sm:flex-row sm:items-start justify-between gap-3"><div><div class="section-title">Complete Volunteer Points Ledger</div><p class="small-muted mt-1">Every recorded point source is listed, including approved activities, Espasyo and Equality Desk check-ins, and point revocations/adjustments.</p></div><button class="btn btn-soft" onclick="downloadAllAnalyticsReport()"><i class="fa-solid fa-file-arrow-down"></i> Export Ledger in PDF</button></div><div class="table-wrap mt-4"><table><thead><tr><th>Date</th><th>Volunteer</th><th>Volunteer ID</th><th>Source</th><th>Points change</th><th>Status</th><th>Details / reason</th></tr></thead><tbody>${pointLedgerEntries().slice(0,300).map(r=>`<tr><td>${esc(r.date)}</td><td>${esc(r.name)}</td><td>${esc(r.volunteerId)}</td><td>${esc(r.source)}</td><td class="font-black ${r.awarded<0?'text-red-600':'text-green-700'}">${r.awarded>0?'+':''}${r.awarded}</td><td>${esc(r.status)}</td><td>${esc(r.reason)}</td></tr>`).join('')||'<tr><td colspan="7" class="text-center text-slate-400 py-6">No point activity has been recorded.</td></tr>'}</tbody></table></div><p class="text-xs text-slate-400 mt-3">Showing the latest 300 ledger entries here. The downloadable PDF includes all available entries.</p></section>
<div class="grid sm:grid-cols-2 xl:grid-cols-4 gap-4"><div class="metric"><div class="text-xs font-bold text-slate-500">TOTAL VOLUNTEERS</div><div class="text-3xl font-black mt-2">${db.volunteers.length}</div><div class="text-xs text-green-600 mt-1">${active} active members</div></div><div class="metric"><div class="text-xs font-bold text-slate-500">PENDING SUBMISSIONS</div><div class="text-3xl font-black mt-2">${pending.length}</div><div class="text-xs text-amber-600 mt-1">Needs review</div></div><div class="metric"><div class="text-xs font-bold text-slate-500">APPROVED TASKS</div><div class="text-3xl font-black mt-2">${allSubs().filter(s=>s.status==='Approved').length}</div><div class="text-xs text-slate-500 mt-1">Verified contributions</div></div><div class="metric"><div class="text-xs font-bold text-slate-500">WE POINTS AWARDED</div><div class="text-3xl font-black mt-2">${db.volunteers.reduce((n,v)=>n+totalPoints(v),0).toLocaleString()}</div><div class="text-xs text-slate-500 mt-1">Across all members</div></div></div>
<div class="grid xl:grid-cols-2 gap-5 mt-6"><section class="card p-5"><div class="flex items-center justify-between gap-3 mb-4"><div><div class="section-title">SOGIESC distribution</div><p class="small-muted">Select a segment to inspect its roster.</p></div><i class="fa-solid fa-chart-pie text-violet-600 text-xl"></i></div><div class="chart-box"><canvas id="sogiescChart"></canvas></div></section><section class="card p-5"><div class="flex items-center justify-between gap-3 mb-4"><div><div class="section-title">Educational attainment</div><p class="small-muted">Select a bar to view matching profiles.</p></div><i class="fa-solid fa-chart-column text-pink-600 text-xl"></i></div><div class="chart-box"><canvas id="educationChart"></canvas></div></section></div>
<section class="card mt-6 overflow-hidden" id="admin-submissions"><div class="p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-3"><div><div class="section-title">Task verification queue</div><p class="small-muted mt-1">Review the evidence and set the final points award.</p></div><span class="pill ${pending.length?'pill-yellow':'pill-green'}">${pending.length} pending</span></div><div class="table-wrap"><table><thead><tr><th>Volunteer</th><th>Task / role</th><th>Requested pts</th><th>Final pts</th><th>Action</th></tr></thead><tbody>${pending.length?pending.map(s=>{const v=volunteerById(s.volunteerId);return `<tr><td><div class="font-bold">${esc(v?.name||'Unknown')}</div><div class="text-xs text-slate-400">${esc(s.volunteerId)}</div></td><td><div class="font-bold">${esc(s.taskTitle)}</div><div class="text-xs text-slate-500">${esc(s.eventTitle)} · ${esc(s.role)}</div><div class="text-xs text-slate-400">${fmtDate(s.submittedAt)}</div></td><td>${s.points}</td><td><input class="field" style="width:95px;padding:7px" type="number" min="0" max="10000" id="pts-${s.id}" value="${s.points}"></td><td><div class="flex gap-2"><button class="btn bg-green-100 text-green-800 text-xs" onclick="reviewSubmission('${s.id}','Approved')"><i class="fa-solid fa-check"></i> Approve</button><button class="btn btn-danger text-xs" onclick="reviewSubmission('${s.id}','Declined')"><i class="fa-solid fa-xmark"></i> Decline</button></div></td></tr>`}).join(''):'<tr><td colspan="5" class="text-center text-slate-400 py-8">Queue is clear. No pending submissions.</td></tr>'}</tbody></table></div></section>
<section class="card mt-6 p-5 sm:p-6"><div class="flex flex-col sm:flex-row sm:items-start justify-between gap-3"><div><div class="section-title">Points Review & Revocation</div><p class="small-muted mt-1">If an award is confirmed to be inappropriate, revoke its points with a documented reason. The action is recorded in the submission history.</p></div><span class="pill pill-yellow">Administrator Only</span></div><div class="table-wrap mt-4"><table><thead><tr><th>Volunteer</th><th>Activity</th><th>Approved Points</th><th>Decision</th></tr></thead><tbody>${allSubs().filter(x=>x.status==='Approved'&&Number(x.points||0)>0&&!x.pointsRevoked).slice().reverse().map(x=>{const vv=volunteerById(x.volunteerId);return `<tr><td><div class="font-bold">${esc(vv?.name||'Unknown Volunteer')}</div><div class="text-xs text-slate-400">${esc(x.volunteerId)}</div></td><td><div class="font-semibold">${esc(x.taskTitle||'Volunteer activity')}</div><div class="text-xs text-slate-500">${esc(x.eventTitle||'')} · ${fmtDate(x.reviewedAt||x.submittedAt)}</div></td><td class="font-black text-violet-700">${Number(x.points||0)}</td><td><button class="btn btn-danger text-xs" onclick="revokeSubmissionPoints('${x.id}')"><i class="fa-solid fa-rotate-left"></i> Revoke Points</button></td></tr>`}).join('')||'<tr><td colspan="4" class="text-center text-slate-400 py-5">No eligible approved point awards to review.</td></tr>'}</tbody></table></div><p class="text-xs text-slate-400 mt-3">Revocation requires a reason and cannot be undone from this button. Keep a record of the evidence supporting the decision.</p></section>
<section class="card mt-6 p-5 sm:p-6" id="admin-certificates"><div class="section-title">Certificate issuance manager</div><p class="small-muted mt-1">Upload certificate images in JPG format, review volunteer requests, validate them, then release approved certificates to the volunteer’s account.</p><form class="grid md:grid-cols-[1fr_1fr_auto] gap-3 mt-4" onsubmit="return uploadCertificate(event)"><div><label class="label">Certificate title</label><input class="field" name="title" required placeholder="e.g. Certificate of Appreciation"></div><div><label class="label">JPG certificate image</label><input class="field" name="image" type="file" accept="image/jpeg,.jpg,.jpeg" required></div><div class="flex items-end"><button class="btn btn-primary w-full" type="submit"><i class="fa-solid fa-upload"></i> Upload JPG</button></div></form><div class="mt-4 space-y-2">${(db.certificates||[]).map(c=>`<div class="border rounded-xl p-3 flex flex-wrap items-center gap-3"><div class="flex-1"><div class="font-bold">${esc(c.title)}</div><div class="text-xs text-slate-500">${esc(c.filename||'JPG image')} · ${(db.certificateRequests||[]).filter(r=>r.certificateId===c.id).length} request(s)</div></div><button class="btn btn-line text-xs" onclick="editCertificate('${c.id}')">Edit Certificate</button><button class="btn btn-line text-xs" onclick="toggleCertificate('${c.id}')">${c.active===false?'Enable':'Disable'}</button><button class="btn btn-danger text-xs" onclick="deleteCertificate('${c.id}')">Delete</button></div>`).join('')||'<p class="text-sm text-slate-400">No JPG certificates uploaded yet.</p>'}</div><h3 class="font-black text-lg mt-6">Issuance requests</h3><div class="space-y-2 mt-3">${(db.certificateRequests||[]).slice().reverse().map(r=>{const v=volunteerById(r.volunteerId),c=(db.certificates||[]).find(x=>x.id===r.certificateId);return `<div class="border rounded-xl p-4 flex flex-col lg:flex-row lg:items-center gap-3 justify-between"><div class="flex-1"><div class="font-bold">${esc(v?.name||'Unknown volunteer')} <span class="text-xs text-slate-400">${esc(r.volunteerId)}</span></div><div class="text-sm">${esc(c?.title||'Certificate unavailable')}</div><div class="text-xs text-slate-500">Requested ${fmtDate(r.requestedAt)} · <span class="font-bold">${esc(r.status)}</span></div></div><div class="flex flex-wrap gap-2">${r.status==='Pending'?`<button class="btn bg-green-100 text-green-800 text-xs" onclick="reviewCertificateRequest('${r.id}','Approved')">Validate request</button><button class="btn btn-danger text-xs" onclick="reviewCertificateRequest('${r.id}','Declined')">Decline</button>`:''}${r.status==='Approved'?`<button class="btn btn-primary text-xs" onclick="reviewCertificateRequest('${r.id}','Released')"><i class="fa-solid fa-paper-plane"></i> Release certificate</button>`:''}${r.status==='Released'?`<span class="pill pill-green">Released to volunteer</span><button class="btn btn-danger text-xs" onclick="revokeCertificate('${r.id}')">Revoke Released Certificate</button>`:''}${r.status==='Revoked'?'<span class="pill pill-red">Certificate Revoked</span>':''}</div></div>`}).join('')||'<p class="text-sm text-slate-400">No issuance requests yet.</p>'}</div></section>
<section class="card mt-6 p-5 sm:p-6" id="admin-flagship"><div class="section-title">Flagship Programs & Hyperlinks</div><p class="small-muted mt-1">Add official links to Wagayway Equality Inc.’s flagship programs. Active links appear on the public Home page.</p><form class="grid md:grid-cols-2 gap-3 mt-4" onsubmit="return addFlagshipProgram(event)"><div><label class="label">Program name</label><input class="field" name="title" required maxlength="100" placeholder="e.g. Community Safe Spaces"></div><div><label class="label">Program URL</label><input class="field" name="url" type="url" required placeholder="https://example.org/program"></div><div class="md:col-span-2"><label class="label">Short description (optional)</label><textarea class="field" name="description" rows="2" maxlength="300" placeholder="Briefly describe the flagship program"></textarea></div><div class="md:col-span-2"><label class="label">Program Photo (JPG, PNG, or WebP)</label><input class="field" type="file" name="programPhoto" accept="image/jpeg,image/png,image/webp" onchange="previewFlagshipPhoto(event)"><div id="flagshipPhotoPreview" class="text-xs text-slate-400 mt-2">Optional photo, maximum 850 KB.</div></div><div class="md:col-span-2"><button class="btn btn-primary" type="submit"><i class="fa-solid fa-link"></i> Add flagship program link</button></div></form><div class="space-y-2 mt-4">${(db.settings.flagshipPrograms||[]).map(p=>`<div class="border rounded-xl p-3 flex flex-col sm:flex-row sm:items-center gap-3"><div class="flex-1 min-w-0">${p.image?`<img src="${p.image}" alt="${esc(p.title)}" class="w-28 h-20 object-cover rounded-lg mb-2">`:""}<div class="font-bold">${esc(titleCaseWords(p.title))}</div><a class="text-xs text-violet-700 underline break-all" href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">${esc(p.url)}</a>${p.description?`<p class="text-sm text-slate-500 mt-1">${esc(p.description)}</p>`:''}<span class="pill ${p.active===false?'pill-gray':'pill-green'} mt-2">${p.active===false?'Hidden from Home':'Visible on Home'}</span></div><div class="flex gap-2"><button class="btn btn-line text-xs" onclick="toggleFlagshipProgram('${p.id}')">${p.active===false?'Show':'Hide'}</button><button class="btn btn-danger text-xs" onclick="deleteFlagshipProgram('${p.id}')">Delete</button></div></div>`).join('')||'<p class="text-sm text-slate-400">No flagship program links added yet.</p>'}</div></section>
<section class="card mt-6 p-5 sm:p-6" id="admin-announcements"><div class="flex flex-col sm:flex-row sm:items-start justify-between gap-3"><div><div class="section-title">Homepage announcement editor</div><p class="small-muted mt-1">Changes appear immediately on the Public Portal in this browser.</p></div><span class="pill pill-purple">CMS</span></div><form class="grid md:grid-cols-2 gap-4 mt-5" onsubmit="return saveCMS(event)"><div class="md:col-span-2"><label class="label">Hero headline</label><input class="field" name="heroTitle" value="${esc(db.settings.heroTitle)}" required></div><div class="md:col-span-2"><label class="label">Description</label><textarea class="field" rows="3" name="heroDesc" required>${esc(db.settings.heroDesc)}</textarea></div><div><label class="label">Featured image URL</label><input class="field" name="heroImage" id="heroImageUrl" value="${esc(db.settings.heroImage)}" placeholder="https://..."></div><div><label class="label">Or upload a local image</label><input class="field" type="file" accept="image/*" onchange="previewHeroImage(event)"><div id="heroPreview" class="text-xs text-slate-400 mt-1">Current image URL or upload a new one.</div></div><div class="md:col-span-2 flex justify-end gap-2"><button type="button" class="btn btn-line" onclick="go('public')">Preview public portal</button><button class="btn btn-primary" type="submit"><i class="fa-solid fa-floppy-disk"></i> Save announcement</button></div></form></section>
<section class="card mt-6 p-5"><div class="section-title">Manage public announcements</div><p class="small-muted mt-1">Add multiple announcements and choose whether each is visible on Home.</p><form class="grid md:grid-cols-2 gap-3 mt-4" onsubmit="return addAnnouncement(event)"><div><label class="label">Announcement title</label><input class="field" name="title" required></div><div><label class="label">Date</label><input class="field" name="date" type="date"></div><div class="md:col-span-2"><label class="label">Announcement details</label><textarea class="field" name="body" rows="2" required></textarea></div><div><label class="label">Image URL (optional)</label><input class="field" name="image" id="announcementImageUrl" placeholder="https://..."></div><div><label class="label">Or upload an announcement photo</label><input class="field" type="file" accept="image/*" onchange="previewAnnouncementImage(event)"><div id="announcementImagePreview" class="mt-2 text-xs text-slate-400">Choose an image under 850 KB.</div></div><div class="md:col-span-2"><button class="btn btn-primary" type="submit"><i class="fa-solid fa-plus"></i> Add announcement</button></div></form><div class="space-y-2 mt-4">${(db.settings.announcements||[]).map(a=>`<div class="border rounded-xl p-3 flex items-center gap-3"><div class="flex-1">${a.image?`<img src="${esc(a.image)}" alt="Announcement photo" class="w-16 h-16 object-cover rounded-lg">`:``}<div class="min-w-0 flex-1"><div class="font-bold">${esc(a.title)}</div><div class="text-xs text-slate-500">${esc(a.body)}</div></div></div><button class="btn btn-line text-xs" onclick="toggleAnnouncement('${a.id}')">${a.published===false?'Publish':'Hide'}</button><button class="btn btn-danger text-xs" onclick="deleteAnnouncement('${a.id}')">Delete</button></div>`).join('')||'<p class="text-sm text-slate-400">No announcements yet.</p>'}</div></section>
<section class="card mt-6 p-5 sm:p-6"><div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3"><div><div class="section-title">Volunteer Messages</div><p class="small-muted mt-1">Review questions and concerns sent from volunteer accounts.</p></div><span class="pill pill-yellow">${(db.messages||[]).filter(m=>(m.status||'Pending')==='Pending').length} Pending</span></div><div class="space-y-3 mt-4">${(db.messages||[]).slice().reverse().map(m=>{const v=volunteerById(m.volunteerId);return `<article class="border rounded-xl p-4"><div class="flex flex-col sm:flex-row sm:justify-between gap-2"><div><div class="font-bold">${esc(titleCaseWords(m.subject))}</div><div class="text-xs text-slate-500">${esc(v?.name||'Unknown Volunteer')} · ${esc(m.volunteerId)} · ${fmtDate(m.date)}</div></div><span class="pill ${m.status==='Handled'?'pill-green':'pill-yellow'} self-start">${esc(m.status||'Pending')}</span></div><p class="text-sm mt-3 whitespace-pre-wrap">${esc(m.body)}</p>${m.adminReply?`<div class="rounded-lg bg-purple-50 p-3 mt-3"><div class="text-xs font-bold text-purple-800">Previous Reply</div><p class="text-sm mt-1 whitespace-pre-wrap">${esc(m.adminReply)}</p></div>`:''}<form class="mt-3 space-y-2" onsubmit="return replyAdminMessage(event,'${m.id}')"><label class="label">Administrator Reply</label><textarea class="field" name="reply" rows="2" maxlength="2000" placeholder="Write a reply to the volunteer">${esc(m.adminReply||'')}</textarea><div class="flex flex-wrap gap-2"><button class="btn btn-primary text-xs" type="submit"><i class="fa-solid fa-reply"></i> Save Reply & Mark Handled</button>${m.status!=='Handled'?`<button class="btn btn-line text-xs" type="button" onclick="markMessageHandled('${m.id}')">Mark Handled Without Reply</button>`:''}</div></form></article>`}).join('')||'<p class="text-sm text-slate-400">No messages from volunteers yet.</p>'}</div></section>
<section class="card mt-6 p-5"><div class="flex justify-between items-center gap-3"><div><div class="section-title">Password assistance requests</div><p class="small-muted mt-1">Review requests from volunteers who cannot access their accounts.</p></div><span class="pill pill-yellow">${(db.passwordRequests||[]).filter(r=>r.status==='Pending').length} pending</span></div><div class="space-y-2 mt-4">${(db.passwordRequests||[]).filter(r=>r.status==='Pending').map(r=>`<div class="border rounded-xl p-3 flex flex-wrap items-center gap-3"><div class="flex-1"><div class="font-bold">${esc(r.name)}</div><div class="text-xs text-slate-500">Account: ${esc(r.accountType||'volunteer')} · ID/username: ${esc(r.id)} · ${fmtDate(r.date)}</div><div class="text-sm mt-1">${esc(r.message||'Password assistance requested.')}</div></div><button class="btn btn-primary text-xs" onclick="resolvePasswordRequest('${r.requestId}')">Reset password &amp; mark handled</button></div>`).join('')||'<p class="text-sm text-slate-400">No pending password requests.</p>'}</div></section>

 gap-3"><div><div class="section-title">Master volunteer directory</div><p class="small-muted mt-1">Search and filter by volunteer identity, education program, and account status. Open a profile to review points, submissions, and contact details.</p></div><div class="grid sm:grid-cols-2 xl:grid-cols-4 gap-2"><input id="directorySearch" class="field" placeholder="Search name, ID, email, alias, skills…" value="${esc(directoryFilterState.query)}" oninput="setDirectoryFilter('query',this.value)" aria-label="Search volunteers"><select id="directoryProgramFilter" class="field" onchange="setDirectoryFilter('program',this.value)" aria-label="Filter by education program"><option value="">All education programs</option>${[...new Set(db.volunteers.map(v=>String(v.education||'').trim()).filter(Boolean))].sort().map(x=>`<option value="${esc(x)}" ${directoryFilterState.program===x?'selected':''}>${esc(x)}</option>`).join('')}</select><select id="directoryStatusFilter" class="field" onchange="setDirectoryFilter('status',this.value)" aria-label="Filter by account status"><option value="">All account statuses</option><option value="Active" ${directoryFilterState.status==='Active'?'selected':''}>Active</option><option value="Inactive" ${directoryFilterState.status==='Inactive'?'selected':''}>Inactive</option><option value="Archived" ${directoryFilterState.status==='Archived'?'selected':''}>Archived</option></select><div class="flex gap-2"><button class="btn btn-line" onclick="resetDirectoryFilters()"><i class="fa-solid fa-rotate-left"></i> Reset filters</button><button class="btn btn-primary" onclick="openAddEvent()"><i class="fa-solid fa-plus"></i> Add project</button></div></div><p id="directoryResultCount" class="text-xs text-slate-500" aria-live="polite"></p></div><div class="table-wrap"><table><thead><tr><th>Volunteer</th><th>SOGIESC / Location</th><th>WE Points</th><th>Status</th><th>Leaderboard</th><th>Actions</th></tr></thead><tbody id="directoryBody">${directoryRows(db.volun function portalNotificationItems(role,volunteerId){
 const items=[];const read=new Set(db.notificationReads||[]);
 if(role==='admin'){
  allSubs().filter(x=>x.status==='Pending').forEach(x=>items.push({key:'sub:'+x.id,title:'Activity awaiting review',detail:(volunteerById(x.volunteerId)?.name||x.volunteerId)+' · '+(x.taskTitle||'Activity submission'),target:'admin-submissions',kind:'Activity'}));
  (db.certificateRequests||[]).filter(x=>x.status==='Pending').forEach(x=>items.push({key:'cert:'+x.id,title:'Certificate request pending',detail:(volunteerById(x.volunteerId)?.name||x.volunteerId)+' · '+(x.title||x.certificateTitle||'Certificate'),target:'admin-certificates',kind:'Certificate'}));
  (db.messages||[]).filter(x=>(x.status||'Pending')==='Pending').forEach(x=>items.push({key:'msg:'+x.id,title:'Volunteer message needs a reply',detail:(volunteerById(x.volunteerId)?.name||x.volunteerId)+' · '+(x.subject||'Message'),target:'admin-messages',kind:'Message'}));
 } else {
  const v=volunteerById(volunteerId);if(!v)return [];
  volunteerSubs(volunteerId).forEach(x=>{if(x.status==='Approved'||x.status==='Declined')items.push({key:'vsub:'+x.id,title:x.status==='Approved'?'Activity approved':'Activity needs attention',detail:(x.taskTitle||'Activity')+(x.status==='Declined'&&x.note?' · '+x.note:''),target:'volunteer-workflow',kind:x.status})});
  (db.messages||[]).filter(x=>x.volunteerId===volunteerId&&x.adminReply&&!x.replySeen).forEach(x=>items.push({key:'vmsg:'+x.id,title:'New administrator reply',detail:x.subject||'Your message has a reply',target:'admin-messages',kind:'Message'}));
  (db.certificateRequests||[]).filter(x=>x.volunteerId===volunteerId&&['Approved','Released','Declined'].includes(x.status)).forEach(x=>items.push({key:'vcert:'+x.id,title:'Certificate request updated',detail:(x.title||x.certificateTitle||'Certificate')+' · '+x.status,target:'certificates',kind:'Certificate'}));
 }
 return items.map(x=>({...x,read:read.has(x.key)})).sort((a,b)=>Number(a.read)-Number(b.read));
}

function classifyAdminSection(sec){
 const id=sec.id||'',t=(sec.innerText||sec.textContent||'').toLowerCase();
 if(['global-search-panel','admin-notification-center','admin-dashboard'].includes(id))return 'dashboard';
 if(id==='admin-submissions'||t.includes('points review & revocation')||t.includes('task verification queue'))return 'activities';
 if(id==='admin-monthly-history')return 'engagement';
 if(id==='admin-engagement-analytics'||t.includes('homepage visitor analytics')||t.includes('sogiesc distribution')||t.includes('educational attainment'))return id==='admin-engagement-analytics'?'analytics':'dashboard';
 if(id==='admin-certificates'||t.includes('certificate issuance manager'))return 'certificates';
 if(id==='admin-messages'||t.includes('volunteer messages'))return 'messages';
 if(id==='admin-flagship'||t.includes('flagship programs & hyperlinks')||t.includes('project archive'))return 'programs';
 if(id==='admin-announcements'||t.includes('manage public announcements')||t.includes('homepage announcement editor'))return 'homepage';
 if(t.includes('master volunteer directory')||t.includes('password assistance requests'))return 'volunteers';
 return 'dashboard';
}
function setupAdminPages(){
 const app=document.getElementById('app');if(!app||!session||session.type!=='admin'||!adminUnlocked)return;
 app.querySelectorAll('section').forEach(sec=>{sec.dataset.adminPage=classifyAdminSection(sec)});
 // Keep the selected page visible after approval/reply/edit actions re-render the admin center.
 applyAdminPage();
}
function applyAdminPage(){
 const app=document.getElementById('app');if(!app)return;
 app.querySelectorAll('section[data-admin-page]').forEach(sec=>{sec.hidden=sec.dataset.adminPage!==adminView});
 app.querySelectorAll('[data-admin-view]').forEach(btn=>{const active=btn.dataset.adminView===adminView;btn.classList.toggle('active',active);btn.setAttribute('aria-current',active?'page':'false')});
 const titles={dashboard:['Dashboard','Overview of portal activity and items needing attention.'],activities:['Activity Management','Review volunteer submissions and manage point decisions.'],volunteers:['Volunteer Management','Find and manage volunteer accounts and access requests.'],engagement:['Monthly Volunteer Engagement History','Review monthly participation, rankings, verified points, and export reports.'],analytics:['Engagement Analytics','Review participation trends and portal analytics.'],certificates:['Certificate Management','Review certificate requests and manage certificate records.'],messages:['Volunteer Messages','Read and respond to volunteer questions and concerns.'],programs:['Programs & Projects','Manage flagship programs and archived projects.'],homepage:['Homepage Content','Manage announcements and public homepage content.']};
 let banner=app.querySelector('#adminPageHeading');if(!banner){banner=document.createElement('div');banner.id='adminPageHeading';banner.className='card p-4 sm:p-5 mt-4 mb-4';const nav=app.querySelector('.admin-page-nav');if(nav)nav.insertAdjacentElement('afterend',banner);}
 const info=titles[adminView]||titles.dashboard;banner.innerHTML=`<div class="flex flex-wrap items-center justify-between gap-3"><div><div class="text-xs uppercase tracking-wider font-extrabold text-violet-700"><button type="button" class="underline underline-offset-2 hover:text-violet-900" onclick="openAdminPage('dashboard')">Dashboard</button> <span class="text-slate-400 mx-1">/</span> ${esc(info[0])}</div><h2 class="text-2xl font-black mt-1">${info[0]}</h2><p class="text-sm text-slate-500 mt-1">${info[1]}</p></div>${adminView!=='dashboard'?'<button class="btn btn-line text-xs" onclick="openAdminPage(&#39;dashboard&#39;)"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</button>':''}</div>`;
 banner.hidden=false;
 window.scrollTo({top:0,behavior:'smooth'});
}
function openAdminPage(page){const allowed=['dashboard','activities','volunteers','engagement','analytics','certificates','messages','programs','homepage'];if(!allowed.includes(page))page='dashboard';adminView=page;applyAdminPage();}

function renderPortalNotifications(role,volunteerId){const host=document.getElementById(role==='admin'?'adminNotificationList':'volunteerNotificationList');if(!host)return;const items=portalNotificationItems(role,volunteerId);if(!items.length){host.innerHTML='<p class="text-sm text-slate-400 border rounded-xl p-3">You’re all caught up. No new notifications.</p>';return}host.innerHTML=items.slice(0,15).map(n=>`<div class="border rounded-xl p-3 flex items-start gap-3 ${n.read?'opacity-60':'bg-purple-50/50'}"><span class="w-9 h-9 rounded-xl bg-purple-100 text-purple-700 grid place-items-center shrink-0"><i class="fa-solid ${n.kind==='Activity'?'fa-list-check':n.kind==='Certificate'?'fa-award':n.kind==='Message'?'fa-message':'fa-circle-check'}"></i></span><div class="flex-1 min-w-0"><div class="font-bold text-sm">${esc(n.title)} ${n.read?'':'<span class="pill pill-purple ml-1">New</span>'}</div><div class="text-xs text-slate-500 mt-1">${esc(n.detail)}</div><div class="flex gap-2 mt-2"><button class="btn btn-line text-xs" onclick="openPortalNotification('${n.key}','${n.target}','${role}')">${n.read?'Open item':'View item'}</button>${n.read?'':`<button class="btn btn-soft text-xs" onclick="markPortalNotificationRead('${n.key}','${role}')">Mark read</button>`}</div></div></div>`).join('')}
function markPortalNotificationRead(key,role){db.notificationReads=db.notificationReads||[];if(!db.notificationReads.includes(key))db.notificationReads.push(key);save();if(role==='admin')renderPortalNotifications('admin');else renderPortalNotifications('volunteer',session?.id)}
function markAllPortalNotificationsRead(role){db.notificationReads=db.notificationReads||[];portalNotificationItems(role,session?.id).forEach(n=>{if(!db.notificationReads.includes(n.key))db.notificationReads.push(n.key)});save();renderPortalNotifications(role,session?.id);toast('Notifications marked as read.')}
function openPortalNotification(key,target,role){markPortalNotificationRead(key,role);if(role==='admin'){const page=target==='admin-submissions'?'activities':target==='admin-monthly-history'?'engagement':target==='admin-engagement-analytics'?'analytics':target==='admin-certificates'?'certificates':target==='admin-messages'?'messages':target==='admin-flagship'?'programs':target==='admin-announcements'?'homepage':'dashboard';openAdminPage(page);return}if(role==='volunteer'){const page=target==='certificates'?'certificates':target==='achievements'?'achievements':target==='admin-messages'?'messages':target==='engagement-report'?'report':target==='opportunities'?'activities':'dashboard';openVolunteerPage(page);return}document.getElementById(target)?.scrollIntoView({behavior:'smooth',block:'start'});}
function globalPortalSearch(query,showAll=false){const q=String(query||'').trim().toLowerCase(),host=document.getElementById('globalSearchResults');if(!host)return;if(!q){host.classList.add('hidden');host.innerHTML='';return}const results=[];const add=(type,title,detail,target,extra='')=>{const hay=(title+' '+detail+' '+type+' '+extra).toLowerCase();if(hay.includes(q))results.push({type,title,detail,target})};
 db.volunteers.forEach(v=>add('Volunteer',v.name,`${v.id} · ${v.alias||''} · ${v.email||''} · ${v.status}`,null,v.skills||''));
 allSubs().forEach(x=>add('Submission',x.taskTitle||'Activity',`${volunteerById(x.volunteerId)?.name||x.volunteerId} · ${x.id} · ${x.status} · ${x.eventTitle||''}`,'admin-submissions'));
 (db.certificateRequests||[]).forEach(x=>add('Certificate',x.title||x.certificateTitle||'Certificate',`${volunteerById(x.volunteerId)?.name||x.volunteerId} · ${x.status} · ${x.id}`,'admin-certificates'));
 (db.certificates||[]).forEach(x=>add('Certificate',x.title||x.name||'Issued certificate',`${volunteerById(x.volunteerId)?.name||x.volunteerId} · ${x.id||''}`,'admin-certificates'));
 (db.messages||[]).forEach(x=>add('Message',x.subject||'Volunteer message',`${volunteerById(x.volunteerId)?.name||x.volunteerId} · ${x.status||'Pending'} · ${x.body||''}`,'admin-messages'));
 const shown=results.slice(0,showAll?100:8);host.classList.remove('hidden');host.innerHTML=shown.length?`<div class="text-xs text-slate-500 mb-2">${results.length} result(s)${results.length>shown.length?' · showing first '+shown.length:''}</div><div class="space-y-2">${shown.map(r=>`<button class="w-full text-left border rounded-xl p-3 hover:bg-purple-50" onclick="openGlobalSearchResult('${r.type}','${encodeURIComponent(r.title)}','${r.target||''}')"><div class="flex flex-wrap gap-2 items-center"><span class="pill pill-purple">${esc(r.type)}</span><b>${esc(r.title)}</b></div><div class="text-xs text-slate-500 mt-1">${esc(r.detail)}</div></button>`).join('')}</div>`:'<p class="text-sm text-slate-400 border rounded-xl p-3">No matching records found.</p>'}
function openGlobalSearchResult(type,encodedTitle,target){const title=decodeURIComponent(encodedTitle);if(type==='Volunteer'){const v=db.volunteers.find(x=>x.name===title);if(v){inspectVolunteer(v.id);return}}if(target){const page=target==='admin-submissions'?'activities':target==='admin-certificates'?'certificates':target==='admin-messages'?'messages':'dashboard';openAdminPage(page)}if(type==='Submission')toast('Open the matching item in the activity review page.');else if(type==='Certificate')toast('Open the matching item in certificate management.');else if(type==='Message')toast('Open the matching conversation in volunteer messages.')}
function openAdminLogin(){modal(`<div class="p-5 sm:p-7"><div class="flex items-start justify-between gap-3"><div><span class="pill pill-purple mb-2">Restricted access</span><h2 class="text-2xl font-black">Administrator login</h2><p class="text-sm text-slate-500 mt-1">Sign in with your administrator username and password.</p></div><button type="button" aria-label="Close dialog" class="btn btn-soft" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button></div><form class="mt-6 space-y-4" onsubmit="return unlockAdmin(event)"><div><label class="label">Admin username</label><input class="field" name="username" autocomplete="username" required placeholder="wagaywayportal"></div><div><label class="label">Admin password</label><input class="field" name="key" type="password" autocomplete="current-password" required placeholder="Enter admin password"></div><button class="btn btn-primary w-full" type="submit"><i class="fa-solid fa-lock-open"></i> Sign in as administrator</button></form></div>`)}
function unlockAdmin(e){e.preventDefault();const f=new FormData(e.target),username=String(f.get('username')||''),key=String(f.get('key')||'');if(volunteerById(username)){const v=volunteerById(username);if(v.password===key&&v.status==='Active'){session={type:'volunteer',id:v.id};persistVolunteerSession();resetVolunteerInactivityTimer();toast('Signed in successfully.');go('volunteer');return false}}const locationAccounts={Espasyo:{locationKey:'espasyo'},Equalitydesk:{locationKey:'equalityDesk'}};const locationAccount=locationAccounts[username];if(locationAccount&&key===String(db.settings.locationPasswords?.[locationAccount.locationKey]||'')){session={type:'locationAdmin',locationKey:locationAccount.locationKey,username};adminUnlocked=true;persistAdminSession();closeModal();toast('Signed in to '+QR_SCANNERS[locationAccount.locationKey].name+' scanner dashboard.');go('admin');return false}if(username===db.settings.adminUser&&key===db.settings.adminKey){session={type:'admin'};adminUnlocked=true;persistAdminSession();toast('Admin access granted. Opening the Admin Control Center in a separate tab.');let opened=null;try{const adminUrl=new URL(location.href);adminUrl.hash='admin';opened=window.open(adminUrl.href,'_blank','noopener=false');}catch(err){}if(opened){closeModal();return false;}toast('The browser blocked the new tab. Opening the Admin Control Center here instead.','info');go('admin')}else toast('Invalid administrator credentials.','error');return false}
function reviewSubmission(id,status){const s=allSubs().find(x=>x.id===id);if(!s||s.status!=='Pending')return;let pts=Number(document.getElementById('pts-'+id)?.value??s.points);if(!Number.isFinite(pts)||pts<0||pts>10000){toast('Enter a valid points amount from 0 to 10,000.','error');return}if(status==='Declined'){pts=0;s.note='Declined by administrator';}else{s.note='Approved and verified by administrator';const v=volunteerById(s.volunteerId);if(v){v.points=totalPoints(v)+pts;v.monthPoints=Number(v.monthPoints||0)+pts;s.monthKey=db.monthKey;checkReferralReward(v.id)}}s.points=pts;s.status=status;s.reviewedAt=new Date().toISOString().slice(0,10);save();toast(`Submission ${status.toLowerCase()}.`);renderAdmin()}
function revokeSubmissionPoints(id){const s=allSubs().find(x=>x.id===id);if(!s||s.status!=='Approved'||s.pointsRevoked||Number(s.points||0)<=0)return;const reason=prompt('Enter the reason and evidence summary for revoking these points:');if(reason===null)return;if(!reason.trim()){toast('A documented reason is required.','error');return}const v=volunteerById(s.volunteerId),amount=Number(s.points||0);if(!v)return;if(!confirm(`Revoke ${amount} points from ${v.name}? This action will be recorded.`))return;v.points=Math.max(0,totalPoints(v)-amount);if((s.monthKey||'')===db.monthKey)v.monthPoints=Math.max(0,Number(v.monthPoints||0)-amount);s.pointsRevoked=true;s.revokedPoints=amount;s.points=0;s.revocationReason=reason.trim();s.revokedAt=new Date().toISOString().slice(0,10);s.revokedBy='Administrator';s.note=(s.note? s.note+' · ':'')+'Points revoked: '+reason.trim();db.pointAudit=db.pointAudit||[];db.pointAudit.push({id:'PA-'+Date.now(),volunteerId:v.id,submissionId:s.id,amount,reason:reason.trim(),date:s.revokedAt,by:'Administrator'});save();toast('Points revoked and recorded.');renderAdmin()}

let pendingHero='';
function previewHeroImage(e){const f=e.target.files?.[0];if(!f)return;if(f.size>1200000){toast('Please choose an image under 1.2 MB.','error');return}const r=new FileReader();r.onload=()=>{pendingHero=r.result;document.getElementById('heroPreview').innerHTML=`<img src="${pendingHero}" class="w-28 h-16 object-cover rounded-lg mt-2">`};r.readAsDataURL(f)}

function addFlagshipProgram(e){e.preventDefault();const f=new FormData(e.target),title=titleCaseWords(String(f.get('title')||'').trim()),rawUrl=String(f.get('url')||'').trim(),description=String(f.get('description')||'').trim();let u;try{u=new URL(rawUrl)}catch(err){toast('Enter a valid program URL.','error');return false}if(!['https:','http:'].includes(u.protocol)){toast('Only HTTP or HTTPS links are allowed.','error');return false}db.settings.flagshipPrograms=db.settings.flagshipPrograms||[];db.settings.flagshipPrograms.push({id:'FP-'+Date.now(),title,url:u.href,description,image:pendingFlagshipPhoto,active:true,createdAt:new Date().toISOString().slice(0,10)});pendingFlagshipPhoto='';save();toast('Flagship program link added.');renderAdmin();return false}
